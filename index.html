<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Астана: Жаңа өмір</title>
<meta name="description" content="Пиксельный симулятор жизни в Астане: работа, друзья, казахский язык, той и первая зима в столице.">
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;800;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Город Астана"></canvas>
  <header id="hud" hidden>
    <div class="hud-l">
      <div class="status fx-panel" id="hud-status">
        <img id="hud-face" class="face" alt="">
        <div class="st-main">
          <div class="st-row"><b id="hud-clock"></b><img id="hud-wx" alt=""><span id="hud-temp"></span></div>
          <div class="st-row small"><span id="hud-date"></span><span class="money" id="hud-money"></span></div>
        </div>
      </div>
      <div class="needs">
        <div class="need" id="need-energy" aria-label="Энергия"><img alt=""></div>
        <div class="need" id="need-food" aria-label="Сытость"><img alt=""></div>
        <div class="need" id="need-mood" aria-label="Настроение"><img alt=""></div>
        <div class="need" id="need-hyg" aria-label="Гигиена"><img alt=""></div>
      </div>
      <button id="objective" class="objective fx-paper" hidden></button>
    </div>
    <div class="hud-r">
      <button id="btn-phone" class="phone-btn fx-gold" aria-label="Телефон"><img alt=""><i id="phone-badge" hidden></i></button>
    </div>
  </header>
  <div id="area-banner" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="hint" hidden></div>
  <div id="touch" hidden><div id="stick"><div id="knob"></div></div><button id="btn-act" aria-label="Действие"><span>E</span></button></div>
  <div id="layer"></div>
  <div id="fade"></div>
</div>
<script src="src/util.js"></script>
<script src="src/art.js"></script>
<script src="src/uikit.js"></script>
<script src="src/world.js"></script>
<script src="src/entities.js"></script>
<script src="src/game.js"></script>
<script src="src/content.js"></script>
<script src="src/quests.js"></script>
<script src="src/minigames.js"></script>
<script src="src/romance.js"></script>
<script src="src/social.js"></script>
<script src="src/life.js"></script>
<script src="src/interior.js"></script>
<script src="src/city.js"></script>
<script src="src/device.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
