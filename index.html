<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Астана: Жаңа өмір</title>
<meta name="description" content="Пиксельный симулятор жизни в Астане: работа, друзья, казахский язык, той и первая зима в столице.">
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;800;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Город Астана"></canvas>
  <header id="hud" hidden>
    <div class="hud-l">
      <div class="chip time" id="hud-time">
        <span id="hud-date"></span>
        <b id="hud-clock"></b>
        <span class="t"><img id="hud-wx" alt=""><span id="hud-temp"></span></span>
      </div>
      <div class="bars">
        <div class="bar" id="bar-energy" title="Энергия"><img alt="Энергия"><i><b></b></i></div>
        <div class="bar" id="bar-food" title="Сытость"><img alt="Сытость"><i><b></b></i></div>
        <div class="bar" id="bar-mood" title="Настроение"><img alt="Настроение"><i><b></b></i></div>
      </div>
      <button id="objective" class="objective" hidden></button>
    </div>
    <div class="hud-r">
      <div class="chip money" id="hud-money"></div>
      <button id="btn-phone" class="phone-btn" aria-label="Телефон"><img alt=""></button>
    </div>
  </header>
  <div id="area-banner" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="hint" hidden></div>
  <div id="touch" hidden><div id="stick"><div id="knob"></div></div><button id="btn-act" aria-label="Действие">E</button></div>
  <div id="layer"></div>
  <div id="fade"></div>
</div>
<script src="src/util.js"></script>
<script src="src/art.js"></script>
<script src="src/world.js"></script>
<script src="src/entities.js"></script>
<script src="src/game.js"></script>
<script src="src/content.js"></script>
<script src="src/quests.js"></script>
<script src="src/minigames.js"></script>
<script src="src/romance.js"></script>
<script src="src/device.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
